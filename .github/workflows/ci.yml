name: CI

# Parity rule (docs/04 §1): a feature is done only when green on both OSes,
# so the build/test matrix runs macOS + Windows from day 1. Signing dry-runs
# and AE-in-the-loop smoke suites land on self-hosted runners in Phase 1
# (docs/04 §7, docs/05 Phase 0 exit criteria).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Upload panel dist
        uses: actions/upload-artifact@v4
        with:
          name: operator-dist-${{ matrix.os }}
          path: |
            apps/panel/dist
            apps/jsx/dist
          if-no-files-found: error
